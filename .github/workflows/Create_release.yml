name: Reusable - Create release

on:
  workflow_call:
    inputs:
      os:
        description: Target OS string (e.g., windows, linux)
        type: string
        required: true
      artifact_name:
        description: Filename to upload to the release (path relative to repo root)
        type: string
        required: true
    secrets:
      RELEASE_TOKEN:
        required: true

jobs:
  create-release:
    name: Create or update release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure tools (gh, zip, xz)
        run: |
          sudo apt-get update
          sudo apt-get install -y gh zip xz-utils

      # If you need to build or package here, do it now. Otherwise,
      # ensure the artifact exists at the path given by inputs.artifact_name.

      - name: Auth gh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh auth status || echo "$GH_TOKEN" | gh auth login --with-token

      - name: Create / edit release and upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          ASSET_PATH: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail

          NOTES_FALLBACK="Automated build from ${GITHUB_REF_NAME}"
          notes="$(jq -r '.head_commit.message // empty' <<<"${GITHUB_EVENT_PATH:+$(cat "$GITHUB_EVENT_PATH")}")"
          RELEASE_NOTES="${notes:-$NOTES_FALLBACK}"

          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH_TAG="${GITHUB_REF_NAME}"

          create_or_edit_release() {
            local tag="$1"
            local title="$2"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" -t "$title" -n "$RELEASE_NOTES"
              gh release upload "$tag" "$ASSET_PATH" --clobber
            else
              gh release create "$tag" "$ASSET_PATH"                 --target "$GITHUB_SHA"                 -t "$title"                 -n "$RELEASE_NOTES"
            fi
          }

          create_or_edit_release "$SHORT_SHA" "${SHORT_SHA}_${BRANCH_TAG}"
          create_or_edit_release "$BRANCH_TAG" "$BRANCH_TAG"
