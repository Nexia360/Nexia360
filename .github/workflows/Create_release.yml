
name: Create release (reusable)

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the artifact previously uploaded with actions/upload-artifact
        type: string
        required: true
      asset_filename:
        description: Desired filename for the asset in the GitHub release
        type: string
        required: true
    secrets:
      RELEASE_TOKEN:
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Validate single file
        id: filecheck
        shell: bash
        run: |
          set -euo pipefail
          count=$(find dist -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No files found in downloaded artifact '${{ inputs.artifact_name }}'"
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::Expected a single file in artifact '${{ inputs.artifact_name }}', found $count"
            find dist -type f -maxdepth 1 -printf "%p\n" || true
            exit 1
          fi
          file=$(find dist -type f -maxdepth 1 | head -n 1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -l "$file"
          if [ ! -s "$file" ]; then
            echo "::error::Downloaded file is empty"
            exit 1
          fi

      - name: Compute tags and notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH_TAG="${GITHUB_REF_NAME}"
          NOTES="${{ github.event.head_commit.message || '' }}"
          if [ -z "$NOTES" ]; then
            NOTES="Automated build from ${BRANCH_TAG} (${SHORT_SHA})"
          fi
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          printf "%s" "$NOTES" > notes.txt

      - name: Rename asset to desired filename
        shell: bash
        run: |
          set -euo pipefail
          mv "${{ steps.filecheck.outputs.file }}" "dist/${{ inputs.asset_filename }}"
          ls -l dist/

      - name: Install gh
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Auth gh with provided token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh auth status || echo "$GH_TOKEN" | gh auth login --with-token

      - name: Create/Edit release for short SHA tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.short_sha }}"
          title="${{ steps.meta.outputs.short_sha }}_${{ steps.meta.outputs.branch_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" -t "$title" -n "$(cat notes.txt)"
            gh release upload "$tag" "dist/${{ inputs.asset_filename }}" --clobber
          else:
            gh release create "$tag" "dist/${{ inputs.asset_filename }}"               --target "${GITHUB_SHA}"               -t "$title"               -n "$(cat notes.txt)"
          fi

      - name: Create/Edit release for branch tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.branch_tag }}"
          title="${{ steps.meta.outputs.branch_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" -t "$title" -n "$(cat notes.txt)"
            gh release upload "$tag" "dist/${{ inputs.asset_filename }}" --clobber
          else:
            gh release create "$tag" "dist/${{ inputs.asset_filename }}"               --target "${GITHUB_SHA}"               -t "$title"               -n "$(cat notes.txt)"
          fi
