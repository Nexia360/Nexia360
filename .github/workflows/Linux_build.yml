name: Linux build

on:
  push:
    paths-ignore:
      - '.clang-format'
      - '.drone.star'
      - '.gitattributes'
      - '.gitignore'
      - '.github/*'
      - '.github/workflows/Windows_build.yml'
      - '.github/*_TEMPLATE/**'
      - '*.bat'
      - '*.md'
      - '*.ps1'
      - '*.txt'
      - '*.yml'
      - 'docs/**'
      - 'src/**/*_windows.*'
      - 'src/**/*_android.*'
      - 'src/**/*_mac.*'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '.clang-format'
      - '.drone.star'
      - '.gitattributes'
      - '.gitignore'
      - '.github/*'
      - '.github/workflows/Windows_build.yml'
      - '.github/*_TEMPLATE/**'
      - '*.bat'
      - '*.md'
      - '*.ps1'
      - '*.txt'
      - '*.yml'
      - 'docs/**'
      - 'src/**/*_windows.*'
      - 'src/**/*_android.*'
      - 'src/**/*_mac.*'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TOKEN: ${{ vars.RELEASE_TOKEN }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    outputs:
      UBUNTU_BASE: ${{ steps.setup.outputs.UBUNTU_BASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        id: setup
        env:
          LLVM_VERSION: 19
        run: |
          set -euo pipefail
          UBUNTU_BASE=$(lsb_release -cs)
          echo "UBUNTU_BASE=$UBUNTU_BASE" >> "$GITHUB_OUTPUT"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-$LLVM_VERSION main"
          sudo apt-get -y update
          sudo apt-get -y install clang-format-$LLVM_VERSION
      - name: Lint
        run: ./xenia-build.py lint --all

  build-clang:
    name: Build (Clang ${{ matrix.LLVM_VERSION }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        LLVM_VERSION: [20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup
        env:
          UBUNTU_BASE: ${{ needs.lint.outputs.UBUNTU_BASE }}
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-${{ matrix.LLVM_VERSION }} main"
          sudo apt-get -y update
          sudo apt-get -y install mesa-vulkan-drivers valgrind libc++-dev libc++abi-dev libgtk-3-dev libsdl2-dev libvulkan-dev libx11-xcb-dev clang-${{ matrix.LLVM_VERSION }} ninja-build
          ./xenia-build.py setup
      - name: Generate miniupnpcstrings.h
        run: |
          cd third_party/miniupnp/miniupnpc
          sh updateminiupnpcstrings.sh
      - name: Build
        env:
          CC: clang-${{ matrix.LLVM_VERSION }}
          CXX: clang++-${{ matrix.LLVM_VERSION }}
        run: ./xenia-build.py build --config=Release
      - name: Prepare artifacts
        id: prepare_artifacts
        run: |
          set -euo pipefail
          binary=build/bin/Linux/Release/Nexia360
          if [ ! -f "$binary" ]; then
            echo "::error::Binary $binary not found"; exit 1
          fi
          if [ $(stat -c%s "$binary") -le 100000 ]; then
            echo "::error::Binary is too small."; exit 1
          fi
          chmod +x "$binary"
          mkdir -p artifacts
          XZ_OPT=-e9 tar cJf artifacts/xenia_canary_linux.tar.xz "$binary" LICENSE
      - name: Upload linux artifact
        if: steps.prepare_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-linux
          path: artifacts/xenia_canary_linux.tar.xz
          if-no-files-found: error

  create-release:
    name: Create release
    needs: [lint, build-clang]
    if: |
      github.repository == 'xenia-canary/xenia-canary' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/canary_experimental'
    uses: ./.github/workflows/Create_release.yml
    with:
      artifact_name: release-asset-linux
      asset_filename: xenia_canary_linux.tar.xz
