name: Orchestrator

on:
  push:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Pre-requirements
  # ===========================================================================
  commit-message:
    name: Commit Message Validation
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/Check_commit_message.yml

  lint:
    name: Lint
    uses: ./.github/workflows/Lint.yml
    with:
      runs-on: ubuntu-24.04
      llvm_version: 22

  # Parses the pushed commit message for release tags. Both word orders are
  # accepted so a tag is never missed:
  #   [Release Windows] / [Windows Release]        -> Windows build + release
  #   [Release Linux]   / [Linux Release]          -> Linux build + release
  #   [Release Windows, Linux] / [Windows, Linux Release] -> both
  # Pull requests build every platform for verification but never release.
  gate:
    name: Release Gate
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.parse.outputs.windows }}
      linux: ${{ steps.parse.outputs.linux }}
      release: ${{ steps.parse.outputs.release }}
    steps:
      - name: Parse commit message
        id: parse
        env:
          MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |-
          windows=false
          linux=false

          case "$MSG" in
            *"[Release Windows, Linux]"*|*"[Windows, Linux Release]"*)
              windows=true
              linux=true
              ;;
            *)
              case "$MSG" in
                *"[Release Windows]"*|*"[Windows Release]"*) windows=true ;;
              esac
              case "$MSG" in
                *"[Release Linux]"*|*"[Linux Release]"*) linux=true ;;
              esac
              ;;
          esac

          release=false
          if [ "$windows" = true ] || [ "$linux" = true ]; then
            release=true
          fi

          # Pull requests verify builds but must never publish a release.
          if [ "$EVENT" != "push" ]; then
            windows=true
            linux=true
            release=false
          fi

          echo "windows=$windows" >> $GITHUB_OUTPUT
          echo "linux=$linux" >> $GITHUB_OUTPUT
          echo "release=$release" >> $GITHUB_OUTPUT

          echo "windows=$windows linux=$linux release=$release"

  # Add optional steps here

  # ===========================================================================
  # Stage 2: Platform builds
  # ===========================================================================
  build-windows:
    name: Windows (x86-64)
    needs: [lint, commit-message, gate]
    if: ${{ !failure() && !cancelled() && needs.gate.outputs.windows == 'true' }}
    uses: ./.github/workflows/Windows_x86.yml

  # Uncomment when platform support is ready:
  # build-linux:
  #   name: Linux (x86-64)
  #   needs: [lint, commit-message]
  #   if: ${{ !failure() && !cancelled() }}
  #   uses: ./.github/workflows/Linux_x86.yml
  #   with:
  #     runs-on: ${{ needs.lint.outputs.runs-on }}
  #     llvm_version: ${{ needs.lint.outputs.llvm_version }}
  #     ubuntu_base: ${{ needs.lint.outputs.ubuntu_base }}

  # Uncomment when platform support is ready:
  # build-windows-arm64:
  #   name: Windows-ARM64
  #   needs: [lint]
  #   uses: ./.github/workflows/build-win_arm64.yml

  # build-linux-arm64:
  #   name: Linux-ARM64
  #   needs: [lint]
  #   uses: ./.github/workflows/build-linux_arm64.yml

  # build-macos:
  #   name: macOS
  #   needs: [lint]
  #   uses: ./.github/workflows/build-macos.yml

  # build-android:
  #   name: Android
  #   needs: [lint]
  #   uses: ./.github/workflows/build-android.yml

  # ===========================================================================
  # Stage 3: Release
  # ===========================================================================
  # Runs only when the pushed commit carries a release tag (see the gate job).
  # A platform that was not requested is skipped, so its result is 'skipped'
  # rather than 'success' - both are acceptable here, a 'failure' is not.
  release:
    name: Create Release
    needs: [gate, build-windows]
    if: |-
      always() &&
      github.repository == 'Nexia360/Nexia360' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/Mousehook' &&
      needs.gate.outputs.release == 'true' &&
      needs.build-windows.result == 'success'
    uses: ./.github/workflows/Create_release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ github.sha }}
      branch: ${{ github.ref_name }}
