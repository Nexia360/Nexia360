
name: Windows build

on:
  push:
    paths-ignore:
      - '.clang-format'
      - '.drone.star'
      - '.gitattributes'
      - '.gitignore'
      - '.gdbinit'
      - '.github/*'
      - '.github/workflows/Linux_build.yml'
      - '.github/*_TEMPLATE/**'
      - '*.md'
      - '*.yml'
      - '*.txt'
      - 'docs/**'
      - 'src/**/*_posix.*'
      - 'src/**/*_linux.*'
      - 'src/**/*_gnulinux.*'
      - 'src/**/*_x11.*'
      - 'src/**/*_gtk.*'
      - 'src/**/*_android.*'
      - 'src/**/*_mac.*'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '.clang-format'
      - '.drone.star'
      - '.gitattributes'
      - '.gitignore'
      - '.gdbinit'
      - '.github/*'
      - '.github/workflows/Linux_build.yml'
      - '.github/*_TEMPLATE/**'
      - '*.md'
      - '*.yml'
      - '*.txt'
      - 'docs/**'
      - 'src/**/*_posix.*'
      - 'src/**/*_linux.*'
      - 'src/**/*_gnulinux.*'
      - 'src/**/*_x11.*'
      - 'src/**/*_gtk.*'
      - 'src/**/*_android.*'
      - 'src/**/*_mac.*'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@main
      - name: Lint
        run: python xenia-build.py lint --all

  build:
    name: Build
    needs: lint
    runs-on: windows-2025
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Setup
        run: python xenia-build.py setup
      - name: Build
        run: python xenia-build.py build --no_premake --config=Release --target=src\xenia-app
      - name: Prepare artifacts
        id: prep
        shell: pwsh
        run: |
          $binary = 'build\bin\Windows\Release\Nexia360.exe'
          if (-not (Test-Path $binary)) {
            Write-Error "$binary not found"; exit 1
          }
          if ((Get-Item $binary).Length -le 100000) {
            Write-Error "$binary is too small."; exit 1
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item -Force $binary artifacts\
          Copy-Item -Force LICENSE artifacts\
          Compress-Archive -Path artifacts\* -DestinationPath artifacts\Nexia360_windows.zip -Force
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-windows
          path: artifacts/Nexia360_windows.zip
          if-no-files-found: error

  create-release:
    name: Create release
    needs: [lint, build]
    if: |
